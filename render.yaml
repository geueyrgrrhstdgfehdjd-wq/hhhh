services:
  - type: web
    name: nextrapro
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nextrapro-db
          property: connectionString

databases:
  - name: nextrapro-db
    region: oregon
    plan: free
