<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXTRA PRO</title><style>body{font-family:system-ui;margin:0;background:#050b18;color:#fff}.box{max-width:1100px;margin:auto;padding:28px}.card{background:#0b1527;border:1px solid #18375f;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.num{font-size:30px;color:#59b5ff;font-weight:800}input,select,button{padding:11px;border-radius:9px;border:1px solid #29466d;background:#07101e;color:#fff;margin:4px}button{background:#087cff;border:0;font-weight:700}pre{white-space:pre-wrap;word-break:break-word}.muted{color:#9eb0ca}</style></head><body><div class="box"><h1>NEXTRA PRO</h1><p class="muted">Render backend • Key API • Admin / Reseller</p><div class="card"><h2>API</h2><p><b>POST /api/login</b> — login Admin/Reseller</p><p><b>POST /api/keys/generate</b> — สร้างคีย์ตามเครดิต</p><p><b>GET /api/keys</b> — รายการคีย์ตามสิทธิ์</p><p><b>POST /api/resellers</b> — Admin เท่านั้น</p><p><b>POST /api/patch-files</b> — Admin เท่านั้น</p></div><div class="card"><h2>Health</h2><pre id="h">กำลังตรวจ...</pre></div></div><script>fetch('/health').then(r=>r.json()).then(x=>h.textContent=JSON.stringify(x,null,2)).catch(e=>h.textContent=e.message)</script></body></html>
